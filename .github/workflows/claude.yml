name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    env:
      # Repository variable CLAUDE_MAX_TURNS (Settings → Secrets and variables → Actions → Variables), default 100
      CLAUDE_MAX_TURNS: ${{ vars.CLAUDE_MAX_TURNS || '100' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Install and build up front so the agent can reproduce and test
      # immediately, without spending turns (or permissions) on setup.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 24

      - name: Install and Build
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@ceaf5a669ef2ab0a9de5c7a091933559c8bcbd4b # v1.0.233
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          prompt: |
            This is the Civet programming language compiler. Source is in source/ written in .civet files; the grammar is source/parser.hera. Dependencies are already installed and dist/ is already built.
            - Reproduce compiler output: `./dist/civet -c -e 'code'` (add `--civet coffeeCompat` etc. for flags). Rerun `pnpm build` after editing source/ to refresh dist/.
            - Run tests: `pnpm test`, or one test with `pnpm test:grep "name"`. Tests compile the grammar from source/, so they reflect edits without rebuilding.
            - Work red/green: add a failing test in test/ first, then fix the root cause.
            - Check types with `pnpm typecheck`; changes must not add new errors (the PR's Typecheck CI job reports regressions).

          additional_permissions: |
            actions: read

          show_full_output: ${{ runner.debug == '1' }}
          display_report: true
          track_progress: true

          claude_args: |
            --model claude-opus-5-5
            --allowedTools Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash(git:*),Bash(pnpm install:*),Bash(pnpm build:*),Bash(pnpm test:*),Bash(pnpm typecheck:*),Bash(pnpm coverage:*),Bash(./dist/civet:*),Bash(node:*),Bash(ls:*),Bash(diff:*),Bash(gh pr:*),Bash(gh issue:*),Bash(gh run:*)
            --max-turns ${{ env.CLAUDE_MAX_TURNS }}

      - name: Upload Claude log
        if: always() && steps.claude.outputs.execution_file
        run: aws s3 cp "${{ steps.claude.outputs.execution_file }}" "s3://${{ secrets.CLAUDE_LOG_BUCKET }}/claude-logs/${{ github.repository }}/${{ github.run_id }}-${{ github.run_attempt }}.log"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
